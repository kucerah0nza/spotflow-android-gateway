name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# This workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit: a tag can be moved to different code, a commit can't.
      # Dependabot keeps the pins (and the version comments) current.
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # apiCheck fails if the library's public API differs from spotflow-ble-gateway/api/*.api, so a
      # change to it is always deliberate: run `./gradlew :spotflow-ble-gateway:apiDump` and commit.
      - name: Unit tests and public API check
        run: ./gradlew :spotflow-ble-gateway:testDebugUnitTest :app:testDebugUnitTest :spotflow-ble-gateway:apiCheck --stacktrace

      - name: Lint
        run: ./gradlew :spotflow-ble-gateway:lintDebug :app:lintDebug --stacktrace

      # What a release builds, so it can't break unnoticed until a tag is pushed — and the demo shrunk by
      # R8, which is what checks the library's consumer ProGuard rules.
      - name: Build the release AAR and the R8-shrunk app
        run: ./gradlew :spotflow-ble-gateway:assembleRelease :app:assembleMinified --stacktrace

      # The signing key is given to this one step only, and only for pushes to main: pull requests build
      # an APK signed with the runner's debug key. No other step — and no third-party action — sees it,
      # and the decoded keystore is removed before the step ends.
      - name: Build debug APK
        env:
          SPOTFLOW_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.SPOTFLOW_KEYSTORE_BASE64 || '' }}
          SPOTFLOW_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.SPOTFLOW_KEYSTORE_PASSWORD || '' }}
          SPOTFLOW_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.SPOTFLOW_KEY_ALIAS || '' }}
          SPOTFLOW_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.SPOTFLOW_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$SPOTFLOW_KEYSTORE_BASE64" ]; then
            export SPOTFLOW_KEYSTORE_FILE="$RUNNER_TEMP/spotflow.keystore"
            trap 'rm -f "$SPOTFLOW_KEYSTORE_FILE"' EXIT
            echo "$SPOTFLOW_KEYSTORE_BASE64" | base64 --decode > "$SPOTFLOW_KEYSTORE_FILE"
          fi
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-report
          path: spotflow-ble-gateway/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spotflow-gateway-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
