name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build APK & publish release
    runs-on: ubuntu-latest
    env:
      SPOTFLOW_KEYSTORE_BASE64: ${{ secrets.SPOTFLOW_KEYSTORE_BASE64 }}
      SPOTFLOW_KEYSTORE_PASSWORD: ${{ secrets.SPOTFLOW_KEYSTORE_PASSWORD }}
      SPOTFLOW_KEY_ALIAS: ${{ secrets.SPOTFLOW_KEY_ALIAS }}
      SPOTFLOW_KEY_PASSWORD: ${{ secrets.SPOTFLOW_KEY_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :spotflow-ble-gateway:testDebugUnitTest --stacktrace

      - name: Require signing key
        if: env.SPOTFLOW_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::SPOTFLOW_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned APK."
          exit 1

      - name: Set up signing key
        if: env.SPOTFLOW_KEYSTORE_BASE64 != ''
        run: |
          echo "$SPOTFLOW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spotflow.keystore"
          echo "SPOTFLOW_KEYSTORE_FILE=$RUNNER_TEMP/spotflow.keystore" >> "$GITHUB_ENV"

      - name: Build demo APK and library AAR
        run: ./gradlew :app:assembleRelease :spotflow-ble-gateway:assembleRelease --stacktrace

      - name: Collect release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/spotflow-gateway-${GITHUB_REF_NAME}.apk"
          cp spotflow-ble-gateway/build/outputs/aar/spotflow-ble-gateway-release.aar \
             "dist/spotflow-ble-gateway-${GITHUB_REF_NAME}.aar"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
