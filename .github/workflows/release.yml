name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build APK & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build demo APK and library AAR
        run: ./gradlew :app:assembleDebug :spotflow-ble-gateway:assembleRelease --stacktrace

      - name: Collect release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/spotflow-gateway-${GITHUB_REF_NAME}.apk"
          cp spotflow-ble-gateway/build/outputs/aar/spotflow-ble-gateway-release.aar \
             "dist/spotflow-ble-gateway-${GITHUB_REF_NAME}.aar"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
